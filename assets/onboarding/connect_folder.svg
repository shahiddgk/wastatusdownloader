<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="cfBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="60%" stop-color="#0E1218"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </radialGradient>

    <!-- Dialog Card Background -->
    <linearGradient id="dlgBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222834"/>
      <stop offset="100%" stop-color="#161A22"/>
    </linearGradient>

    <!-- Dialog Border -->
    <linearGradient id="dlgBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Emerald Button Gradient -->
    <linearGradient id="btnMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Pointer Glow -->
    <radialGradient id="ptrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="600" height="500" rx="32" fill="url(#cfBg)"/>

  <!-- Neutral Mobile OS Frame Outline (Subtle Background) -->
  <rect x="110" y="40" width="380" height="420" rx="36" fill="none" stroke="#2D3748" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- System File Picker Dialog (DocumentsUI Mockup) -->
  <g transform="translate(130, 70)">
    <!-- Main Modal Dialog Card (340x360) -->
    <rect width="340" height="360" rx="24" fill="url(#dlgBg)" stroke="url(#dlgBorder)" stroke-width="1.5"/>

    <!-- Dialog Header Bar -->
    <rect x="0" y="0" width="340" height="56" rx="24" fill="#1C212B"/>
    <path d="M 20 28 L 32 28" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 22 L 32 22" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 34 L 32 34" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="33" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#F9FAFB">Select Media Folder</text>

    <!-- Breadcrumb Path Bar -->
    <rect x="16" y="68" width="308" height="32" rx="8" fill="#12151C"/>
    <text x="26" y="88" font-family="monospace" font-size="10" fill="#9CA3AF">Android &gt; media &gt; ... &gt; Media</text>

    <!-- Folder Item 1: .Statuses (Active / Selected) -->
    <g transform="translate(16, 112)">
      <rect width="308" height="48" rx="10" fill="#1A202C" stroke="#10B981" stroke-width="1.2"/>
      <!-- Folder Icon -->
      <path d="M 16 16 L 26 16 L 30 20 L 44 20 C 46 20, 48 22, 48 24 L 48 34 C 48 36, 46 38, 44 38 L 16 38 C 14 38, 12 36, 12 34 L 12 20 C 12 18, 14 16, 16 16 Z" 
            fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
      <text x="58" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F9FAFB">.Statuses</text>
      <text x="58" y="40" font-family="sans-serif" font-size="9" fill="#9CA3AF">Media updates folder</text>
      <!-- Active Check Circle -->
      <circle cx="286" cy="24" r="9" fill="#10B981"/>
      <path d="M 282 24 L 285 27 L 291 21" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Folder Item 2: WhatsApp Images (Neutral) -->
    <g transform="translate(16, 170)">
      <rect width="308" height="44" rx="10" fill="#12151C"/>
      <path d="M 16 14 L 26 14 L 30 18 L 44 18 C 46 18, 48 20, 48 22 L 48 32 C 48 34, 46 36, 44 36 L 16 36 C 14 36, 12 34, 12 32 L 12 18 C 12 16, 14 14, 16 14 Z" 
            fill="#4B5563" fill-opacity="0.3" stroke="#6B7280" stroke-width="1.5"/>
      <text x="58" y="26" font-family="sans-serif" font-size="11" font-weight="500" fill="#D1D5DB">WhatsApp Images</text>
    </g>

    <!-- Folder Item 3: WhatsApp Video (Neutral) -->
    <g transform="translate(16, 222)">
      <rect width="308" height="44" rx="10" fill="#12151C"/>
      <path d="M 16 14 L 26 14 L 30 18 L 44 18 C 46 18, 48 20, 48 22 L 48 32 C 48 34, 46 36, 44 36 L 16 36 C 14 36, 12 34, 12 32 L 12 18 C 12 16, 14 14, 16 14 Z" 
            fill="#4B5563" fill-opacity="0.3" stroke="#6B7280" stroke-width="1.5"/>
      <text x="58" y="26" font-family="sans-serif" font-size="11" font-weight="500" fill="#D1D5DB">WhatsApp Video</text>
    </g>

    <!-- System Action Bottom Bar: "USE THIS FOLDER" -->
    <g transform="translate(16, 288)">
      <!-- Glow surrounding the button -->
      <rect x="-6" y="-6" width="320" height="56" rx="18" fill="url(#ptrGlow)"/>
      <rect width="308" height="44" rx="12" fill="url(#btnMint)"/>
      <path d="M 88 22 L 96 22 M 92 18 L 92 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="108" y="27" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">USE THIS FOLDER</text>
    </g>
  </g>

  <!-- Guiding Indicator Finger / Pointer Motif -->
  <g transform="translate(420, 360)">
    <circle cx="20" cy="20" r="28" fill="#10B981" fill-opacity="0.2"/>
    <circle cx="20" cy="20" r="14" fill="#34D399" fill-opacity="0.4"/>
    <!-- Stylized touch point -->
    <circle cx="20" cy="20" r="6" fill="#FFFFFF"/>
  </g>
</svg>
