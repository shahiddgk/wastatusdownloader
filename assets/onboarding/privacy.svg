<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="pBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="60%" stop-color="#0E1218"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </radialGradient>

    <!-- Emerald Shield Glow -->
    <radialGradient id="pGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Chip Circuit Pattern -->
    <linearGradient id="circuitLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="500" rx="32" fill="url(#pBg)"/>
  <rect width="600" height="500" fill="url(#pGlow)"/>

  <!-- Background Orbit / Enclave Rings -->
  <circle cx="300" cy="240" r="180" fill="none" stroke="#10B981" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="240" r="220" fill="none" stroke="#6366F1" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Master Privacy Shield Geometry -->
  <path d="M 300 80 
           C 390 80, 430 110, 430 190 
           C 430 300, 340 370, 300 400 
           C 260 370, 170 300, 170 190 
           C 170 110, 210 80, 300 80 Z"
        fill="url(#shieldGrad)"
        stroke="url(#shieldBorder)"
        stroke-width="3.5"/>

  <!-- Inner Vault Enclave (Physical Microchip Core) -->
  <rect x="230" y="170" width="140" height="140" rx="24" fill="#161E2E" stroke="#34D399" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Secure Lock Iconography Inside Enclave -->
  <!-- Shackle -->
  <path d="M 276 225 L 276 205 C 276 191, 286 181, 300 181 C 314 181, 324 191, 324 205 L 324 225" 
        fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round"/>
  <!-- Lock Body -->
  <rect x="264" y="222" width="72" height="56" rx="14" fill="#10B981"/>
  <!-- Keyhole -->
  <circle cx="300" cy="246" r="6" fill="#042F2E"/>
  <path d="M 298 250 L 302 250 L 304 262 L 296 262 Z" fill="#042F2E"/>

  <!-- Circuit Traces Connecting to Device Enclave -->
  <path d="M 230 210 L 195 210" stroke="url(#circuitLine)" stroke-width="2"/>
  <circle cx="192" cy="210" r="3" fill="#10B981"/>

  <path d="M 230 270 L 195 270" stroke="url(#circuitLine)" stroke-width="2"/>
  <circle cx="192" cy="270" r="3" fill="#10B981"/>

  <path d="M 370 210 L 405 210" stroke="url(#circuitLine)" stroke-width="2"/>
  <circle cx="408" cy="210" r="3" fill="#10B981"/>

  <path d="M 370 270 L 405 270" stroke="url(#circuitLine)" stroke-width="2"/>
  <circle cx="408" cy="270" r="3" fill="#10B981"/>

  <!-- Disconnected External Signal Badge (Emphasizing Zero Cloud Transmission) -->
  <g transform="translate(440, 110)">
    <rect width="100" height="30" rx="15" fill="#1E232E" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Slash over cloud / signal -->
    <path d="M 20 15 L 32 15" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <path d="M 16 22 L 36 8" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <text x="42" y="20" font-family="sans-serif" font-size="10" font-weight="600" fill="#9CA3AF">0% Cloud</text>
  </g>

  <!-- Local Hardware Pill (Bottom) -->
  <g transform="translate(235, 330)">
    <rect width="130" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="22" y="17" font-family="sans-serif" font-size="10" font-weight="bold" fill="#A7F3D0">100% ON-DEVICE</text>
  </g>
</svg>
