<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background Radiant Halo -->
    <radialGradient id="ssHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Check Disc Gradient -->
    <linearGradient id="ssDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Disc Border Sheen -->
    <linearGradient id="ssBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Ambient Radiant Halo -->
  <circle cx="150" cy="150" r="130" fill="url(#ssHalo)"/>

  <!-- Ripple Wave 1 -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Ripple Wave 2 -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#6366F1" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Center Gem Disc (88x88) -->
  <circle cx="150" cy="150" r="48" fill="url(#ssDisc)" stroke="url(#ssBorder)" stroke-width="2.5"/>

  <!-- Bold White Crisp Checkmark -->
  <path d="M 130 150 L 144 164 L 172 136" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Satellite Moment Sparks -->
  <circle cx="95" cy="105" r="4" fill="#34D399"/>
  <circle cx="215" cy="115" r="5" fill="#818CF8"/>
  <circle cx="190" cy="205" r="3.5" fill="#6EE7B7"/>
</svg>
