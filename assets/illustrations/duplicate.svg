<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background Amber/Emerald Aura -->
    <radialGradient id="dupGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card 1 (Back) -->
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <!-- Card 2 (Front) -->
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <!-- Shield Face -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="150" cy="150" r="120" fill="url(#dupGlow)"/>

  <!-- Back Media Card (Offset Left) -->
  <g transform="translate(65, 75) rotate(-8)">
    <rect width="95" height="135" rx="14" fill="url(#cardBack)" stroke="#4B5563" stroke-width="1.5"/>
    <circle cx="48" cy="50" r="16" fill="#4B5563" fill-opacity="0.5"/>
    <path d="M 12 110 L 35 80 L 55 100 L 70 85 L 85 110 Z" fill="#1A202C"/>
  </g>

  <!-- Front Media Card (Offset Right - Duplicate) -->
  <g transform="translate(130, 70) rotate(6)">
    <rect width="95" height="135" rx="14" fill="url(#cardFront)" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="48" cy="50" r="16" fill="#6EE7B7" fill-opacity="0.4"/>
    <path d="M 12 110 L 35 80 L 55 100 L 70 85 L 85 110 Z" fill="#111827"/>
  </g>

  <!-- Protective Duplicate Shield Badge in Foreground -->
  <g transform="translate(110, 150)">
    <!-- Outer Shield Drop Shadow/Border -->
    <path d="M 40 5 C 62 5, 72 15, 72 38 C 72 65, 52 82, 40 90 C 28 82, 8 65, 8 38 C 8 15, 18 5, 40 5 Z" 
          fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Inner Checkmark Symbol -->
    <path d="M 28 42 L 36 50 L 52 32" 
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Balance Scales / Twin Sync Motif -->
  <circle cx="85" cy="55" r="3" fill="#10B981"/>
  <circle cx="215" cy="50" r="3" fill="#10B981"/>
</svg>
