<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="nsBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="60%" stop-color="#0F1218"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </radialGradient>

    <!-- Morning Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ceramic Cup Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <!-- Table Horizon -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#11141A"/>
    </linearGradient>
  </defs>

  <rect width="500" height="450" rx="28" fill="url(#nsBg)"/>

  <!-- Morning Window / Sun Ray Horizon in Background -->
  <circle cx="250" cy="180" r="110" fill="url(#sunGlow)"/>

  <!-- Minimalist Window Frame -->
  <rect x="170" y="70" width="160" height="180" rx="16" fill="#12151C" stroke="#2D3748" stroke-width="1.5"/>
  <line x1="250" y1="70" x2="250" y2="250" stroke="#2D3748" stroke-width="1.5"/>
  <line x1="170" y1="160" x2="330" y2="160" stroke="#2D3748" stroke-width="1.5"/>

  <!-- Minimalist Quiet Sun Rising in Window -->
  <circle cx="250" cy="140" r="28" fill="#FBBF24" fill-opacity="0.6"/>

  <!-- Table Surface -->
  <path d="M 80 320 L 420 320 L 440 380 L 60 380 Z" fill="url(#tableGrad)" stroke="#374151" stroke-width="1.5"/>

  <!-- Ceramic Coffee Cup (Quiet Morning) -->
  <g transform="translate(210, 245)">
    <!-- Saucer -->
    <ellipse cx="40" cy="80" rx="46" ry="10" fill="#1A202C" stroke="#4B5563" stroke-width="1.5"/>
    <!-- Cup Body -->
    <path d="M 12 25 L 68 25 L 62 74 C 62 78, 54 82, 40 82 C 26 82, 18 78, 18 74 Z" fill="url(#cupGrad)" stroke="#4B5563" stroke-width="1.5"/>
    <!-- Cup Handle -->
    <path d="M 66 35 C 80 35, 82 58, 64 62" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam / Warmth Ribbons (Aurora Mint) -->
    <path d="M 30 15 Q 35 5 28 -5" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M 44 18 Q 50 8 42 -2" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>

  <!-- Floating Sparkles (Calm Stillness) -->
  <circle cx="120" cy="180" r="3" fill="#34D399" fill-opacity="0.5"/>
  <circle cx="380" cy="140" r="4" fill="#FBBF24" fill-opacity="0.5"/>
  <circle cx="390" cy="260" r="2.5" fill="#818CF8" fill-opacity="0.6"/>
</svg>
