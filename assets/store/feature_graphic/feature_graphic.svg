<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#032f20"/>
      <stop offset="0.55" stop-color="#07583a"/>
      <stop offset="1" stop-color="#021d16"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="48%" r="48%">
      <stop offset="0" stop-color="#22f36f" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#22f36f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="download" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7f8ed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#00190e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#background)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <g transform="translate(72 112)">
    <rect width="188" height="34" rx="17" fill="#b7ff39" fill-opacity="0.14" stroke="#b7ff39" stroke-opacity="0.65"/>
    <circle cx="20" cy="17" r="5" fill="#b7ff39"/>
    <text x="36" y="22" fill="#eaffbd" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">OFFLINE • ON DEVICE</text>

    <text x="0" y="104" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800">WA Status</text>
    <text x="0" y="163" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800">Downloader</text>
    <text x="0" y="211" fill="#d7eee2" font-family="Arial, sans-serif" font-size="22" font-weight="500">Browse and save viewed statuses.</text>
    <text x="0" y="245" fill="#a8ccba" font-family="Arial, sans-serif" font-size="17">Photos and videos stay on your device.</text>
  </g>

  <g transform="translate(694 70)" filter="url(#shadow)">
    <circle cx="150" cy="180" r="143" fill="#078446" stroke="#53ff79" stroke-opacity="0.4" stroke-width="3"/>
    <path d="M52 102 C15 148 12 225 51 276 L36 326 L92 305 C133 328 191 330 235 305"
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M99 63 C139 41 194 41 235 65" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <path d="M252 78 C272 100 286 127 290 157" fill="none" stroke="#b7ff39" stroke-width="22" stroke-linecap="round"/>
    <path d="M292 201 C287 246 269 278 239 303" fill="none" stroke="#b7ff39" stroke-width="22" stroke-linecap="round"/>

    <circle cx="157" cy="184" r="88" fill="#09d853"/>
    <path d="M143 125 h30 v78 h36 l-51 55 -51-55 h36 z" fill="url(#download)"/>
    <path d="M116 260 v15 q0 19 19 19 h47 q19 0 19-19 v-15" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

    <circle cx="260" cy="79" r="53" fill="#078446" stroke="#ffffff" stroke-width="10"/>
    <path d="M247 52 l39 27 -39 27 z" fill="#ffffff"/>
  </g>
