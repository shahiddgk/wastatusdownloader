<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="fgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="60%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </linearGradient>

    <!-- Aurora Radial Sheen -->
    <radialGradient id="fgAurora" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fgAuroraMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#fgBg)"/>
  <rect width="1024" height="500" fill="url(#fgAurora)"/>

  <!-- Left: Brand Positioning & Headline -->
  <g transform="translate(80, 150)">
    <!-- Trust Pill -->
    <rect width="110" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#34D399"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#A7F3D0" letter-spacing="1">100% PRIVATE</text>

    <!-- Main Wordmark / Brand -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="700" fill="#F9FAFB" letter-spacing="-1">Keeva</text>

    <!-- Emotional Value Proposition -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="500" fill="#E5E7EB">Keep the moments that matter.</text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400" fill="#9CA3AF">A calm, private keeper for temporary status media.</text>
  </g>

  <!-- Right: Luminous Aperture & Floating Moments Cards -->
  <g transform="translate(680, 240)">
    <!-- Ambient Light Ring -->
    <circle cx="60" cy="0" r="160" fill="none" stroke="#10B981" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="60" cy="0" r="210" fill="none" stroke="#6366F1" stroke-opacity="0.10" stroke-width="1.5"/>

    <!-- Tilted Back Card -->
    <g transform="translate(-40, -110) rotate(-10)">
      <rect width="130" height="200" rx="18" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <circle cx="65" cy="70" r="24" fill="#6366F1" fill-opacity="0.4"/>
    </g>

    <!-- Front Hero Card -->
    <g transform="translate(40, -90) rotate(8)">
      <rect width="140" height="215" rx="20" fill="#161A22" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
      <circle cx="70" cy="75" r="26" fill="#10B981" fill-opacity="0.5"/>
      <!-- Kept Pill -->
      <g transform="translate(80, 14)">
        <rect width="44" height="22" rx="11" fill="#10B981"/>
        <path d="M 12 11 L 18 16 L 32 7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <!-- Bottom Label -->
      <rect x="14" y="180" width="60" height="20" rx="6" fill="#000000" fill-opacity="0.7"/>
      <text x="22" y="194" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F9FAFB">0:24</text>
    </g>

    <!-- Central Spark Floating in Between -->
    <circle cx="50" cy="10" r="8" fill="#FFFFFF"/>
    <circle cx="50" cy="10" r="24" fill="#10B981" fill-opacity="0.4"/>
  </g>
</svg>
