<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="markBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>

    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="1"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
  </defs>

  <!-- Top: Centered Logo Mark (240x240) at (80, 40) -->
  <g transform="translate(80, 40)">
    <rect width="240" height="240" rx="60" fill="url(#markBgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

    <!-- Preserved Spark Glow and Core -->
    <circle cx="149" cy="107" r="24" fill="url(#sparkGlow)"/>
    <circle cx="149" cy="107" r="8.5" fill="#FFFFFF"/>

    <!-- Secondary Arc -->
    <path d="M 125 205
             L 171 205
             C 192 205, 205 192, 205 171
             L 205 147"
          fill="none"
          stroke="#6366F1"
          stroke-opacity="0.7"
          stroke-width="13"
          stroke-linecap="round"/>

    <!-- Inward Aperture Ribbon -->
    <path d="M 85 192
             L 85 117
             C 85 87, 104 69, 131 69
             L 160 69
             C 181 69, 194 82, 194 104
             C 194 128, 173 147, 149 147
             L 128 147
             C 112 147, 104 155, 104 171
             L 104 192"
          fill="none"
          stroke="url(#auroraGrad)"
          stroke-width="17"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Bottom: Typography Stack -->
  <g transform="translate(200, 360)">
    <!-- Wordmark centered at x=0 -->
    <text x="0" y="44"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="80"
          font-weight="700"
          letter-spacing="-1.2"
          fill="url(#textGrad)">Keeva</text>

    <!-- Tagline centered at x=0 -->
    <text x="0" y="86"
          text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="14"
          font-weight="600"
          letter-spacing="4.5"
          fill="#10B981">PRIVATE MOMENTS KEEPER</text>
  </g>
</svg>
