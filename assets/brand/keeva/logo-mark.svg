<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Plate Gradient -->
    <linearGradient id="keevaPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>

    <!-- Aurora Ribbon Gradient (Mint to Indigo) -->
    <linearGradient id="keevaAuroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Preserved Spark Radial Glow -->
    <radialGradient id="keevaSparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="1"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Outer Border Sheen -->
    <linearGradient id="keevaBorderSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Plate Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#keevaPlateGrad)" stroke="url(#keevaBorderSheen)" stroke-width="4"/>

  <!-- Ambient Preserved Spark Glow -->
  <circle cx="280" cy="200" r="44" fill="url(#keevaSparkGlow)"/>

  <!-- Core Gleaming Spark Beacon -->
  <circle cx="280" cy="200" r="16" fill="#FFFFFF"/>

  <!-- Secondary Memory Envelope Arc (Aurora Indigo) -->
  <path d="M 232 384
           L 320 384
           C 360 384, 384 360, 384 320
           L 384 272"
        fill="none"
        stroke="#6366F1"
        stroke-opacity="0.7"
        stroke-width="24"
        stroke-linecap="round"/>

  <!-- The Inward Aperture Ribbon (Aurora Mint to Indigo) -->
  <path d="M 160 360
           L 160 216
           C 160 160, 196 128, 248 128
           L 304 128
           C 344 128, 368 152, 368 192
           C 368 240, 328 272, 280 272
           L 240 272
           C 208 272, 192 288, 192 320
           L 192 360"
        fill="none"
        stroke="url(#keevaAuroraGrad)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
