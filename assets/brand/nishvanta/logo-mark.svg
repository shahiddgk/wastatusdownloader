<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Plate Gradient -->
    <linearGradient id="nishvantaPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>

    <!-- Outer Border Sheen -->
    <linearGradient id="nishvantaBorderSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Geometric N Gradient (Indigo to Deep Cobalt) -->
    <linearGradient id="nishvantaNGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Forward Momentum Beacon Radial Glow -->
    <radialGradient id="nishvantaBeaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Plate Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#nishvantaPlateGrad)" stroke="url(#nishvantaBorderSheen)" stroke-width="4"/>

  <!-- Subtle Forward Momentum Beacon (Mint accent indicating technology you can trust) -->
  <circle cx="352" cy="152" r="28" fill="url(#nishvantaBeaconGlow)"/>
  <circle cx="352" cy="152" r="9" fill="#FFFFFF"/>

  <!-- Geometric Continuous N Construction -->
  <path d="M 160 360
           L 160 160
           C 160 142, 174 134, 190 146
           L 322 334
           C 338 346, 352 338, 352 320
           L 352 152"
        fill="none"
        stroke="url(#nishvantaNGrad)"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
