<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240">
  <defs>
    <!-- Mark Background Gradient -->
    <linearGradient id="nvMarkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>

    <!-- Outer Border Sheen -->
    <linearGradient id="nvBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Geometric N Gradient -->
    <linearGradient id="nvNGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Forward Beacon Radial Glow -->
    <radialGradient id="nvBeaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nvTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
  </defs>

  <!-- Left: Logo Mark Container (180x180) -->
  <g transform="translate(30, 30)">
    <rect width="180" height="180" rx="46" fill="url(#nvMarkBgGrad)" stroke="url(#nvBorderGrad)" stroke-width="2"/>

    <!-- Forward Beacon -->
    <circle cx="124" cy="54" r="10" fill="url(#nvBeaconGlow)"/>
    <circle cx="124" cy="54" r="3.5" fill="#FFFFFF"/>

    <!-- Geometric N Ribbon Scaled -->
    <path d="M 56 127
             L 56 56
             C 56 50, 61 47, 67 51
             L 113 118
             C 119 122, 124 119, 124 113
             L 124 54"
          fill="none"
          stroke="url(#nvNGrad)"
          stroke-width="15.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Right: Typography Lockup -->
  <g transform="translate(250, 0)">
    <text x="0" y="124"
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="56"
          font-weight="800"
          letter-spacing="5"
          fill="url(#nvTextGrad)">NISHVANTA LABS</text>

    <text x="4" y="168"
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="20"
          font-weight="500"
          letter-spacing="1"
          fill="#9CA3AF">Technology You Can Trust.</text>
  </g>
</svg>
